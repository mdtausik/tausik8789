<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>form tag </h1>
    <div>

        <form action="welcomepage.html" target="_blank">

            <fieldset>
                <legend>enter your basic information</legend>


                <label for="fullname">Full name:</label>
                <input type="text" id="fullname" placeholder="enter you name" required>

                <br><br>
                <label for="email">email:</label>
                <input type="email" id="email" placeholder="enter your email" required>

                <br><br>
                <label for="password">password:</label>
                <input type="password" id="password" placeholder="enter your password" required>

                <br><br>
                <label for="checkbox">Are you 18+ ?:</label>
                <input type="checkbox" id="checkbox" required>

                <br><br>
                <label for="phonenumber">enter your phone number:</label>
                <input type="number" id="phonenumber" required min="0">

                <br><br>
                <label for="male">Gender:</label>
                <label for="male">male:</label>
                <input type="radio" id="male" name="gender">
                <label for="female">female:</label>
                <input type="radio" id="female" name="gender">

                <br><br>
                <label for="date">enter your dob:</label>
                <input type="date" id="date" required>

                <br><br>
                <label for="file">upload photo:</label>
                <input type="file" id="file">


                <br><br>
                <label for="city">select your city:</label>
                <select name="" id="city">
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="noida">Noida</option>
                    <option value="kolkata">Kolkata</option>
                    <option value="jaypur">Jaypur</option>
                    <option value="bihar" selected>Bihar</option>

                </select>




                <br><br>
                <button type="submit">submit form</button>

            </fieldset>
        </form>
    </div>
</body>

</html>
